{% extends "base.html" %}
{% block content %}
<div class="card result-card">
  <span class="result-icon">✅</span>
  <h2>Relatório gerado com sucesso!</h2>
  <p><strong>{{ titulo }}</strong></p>
  <p>{{ num_questoes }} questão(ões) analisada(s).</p>
  <a class="btn-primary" href="{{ url_for('download', filename=report_filename) }}">Baixar relatório em PDF</a>
  <a class="btn-secondary" href="{{ url_for('index') }}">Analisar outra avaliação</a>
</div>
{% endblock %}
